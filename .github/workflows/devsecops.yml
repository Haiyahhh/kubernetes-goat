name: DevSecOps Pipeline - K8s Goat

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Semgrep Scan
        # SCOPING STRATEGY: Explicitly target only the patched directories
        run: >-
          semgrep scan 
          --config "p/ci" --config "p/kubernetes" --config "p/dockerfile" --config "p/golang" --config "p/nodejs" 
          --error 
          infrastructure/health-check/ scenarios/system-monitor/

  sast-sonarqube:
    name: SAST (SonarQube Cloud)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Haiyahhh_kubernetes-goat
            -Dsonar.organization=haiyahhh

  sca-snyk:
    name: SCA (Snyk IaC & Dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js (for Snyk CLI)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Snyk
        run: npm install -g snyk

      - name: Snyk Test (Open Source Dependencies)
        # We append `|| true` here so vulnerabilities in intentionally broken legacy packages 
        # don't block our pipeline
        run: snyk test --all-projects --severity-threshold=high || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk IaC Test (Kubernetes YAML & Dockerfiles)
        # SCOPING STRATEGY: Only audit the patched directories
        run: snyk iac test infrastructure/health-check/ scenarios/system-monitor/ --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}